<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Pad Rafting | Contact Us</title>
    <meta name="description"
      content="Contact Wild Pad Rafting for information about our rafting adventures, reservations, and services. Find our contact information, meet our team, and send us a message.">
    <meta name="author" content="Luz Aroni">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting.jpeg" alt="Wild Pad Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-page">
        <h1>Contact Us</h1>

        <section class="company-info">
            <h2>Get in Touch</h2>

            <div class="contact-details">
                <div>
                    <h3>Wild Pad Rafting</h3>
                    <p><strong>Address:</strong> Av. el Sol 612, Cusco, Peru</p>
                    <p><strong>Phone:</strong> +51 958 796 050</p>
                    <p><strong>Email:</strong> info@wildpadrafting.com</p>
                </div>

                <iframe
                  src="https://maps.google.com/maps?q=Av.%20El%20Sol%20612%2C%20Cusco%2C%20Peru&output=embed"
                  width="100%" height="250" title="Map showing Av. El Sol 612, Cusco, Peru"
                  loading="lazy">
                </iframe>
            </div>
        </section>

        <section class="team">
            <h2>Meet Our Team</h2>

            <div class="team-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of our rafting manager">
                    <figcaption>Maria Lopez — Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of our lead rafting guide">
                    <figcaption>Daniel Torres — Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg"
                      alt="Portrait of our customer service representative">
                    <figcaption>Sofia Ramirez — Customer Service</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>What is the purpose of your message?</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label class="newsletter-label">
                    <input type="checkbox" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>©2026 Wild Pad Rafting | Luz Aroni | Cusco, Peru</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>

            <a href="https://tiktok.com">
                <img src="images/tiktok.svg" alt="TikTok icon">
            </a>
        </nav>
    </footer>
</body>

</html>
