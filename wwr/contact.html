<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Pad Rafting | Contact Us</title>
    <meta name="description"
      content="Contact Wild Pad Rafting for reservations, rafting information, and questions. Meet our team and send us a message about our services.">
    <meta name="author" content="Luz Aroni">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting.jpeg" alt="Wild Pad Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-page">
        <section class="company-info">
            <h1>Wild Pad Rafting</h1>
            <p>
                <strong>Address:</strong> Av. El Sol 612, Cusco, Peru<br>
                <strong>Phone:</strong> +51 958 796 050<br>
                <strong>Email:</strong> info@wildpadrafting.com
            </p>
        </section>

        <div class="contact-main">
            <div class="map-container">
                <iframe
                  src="https://maps.google.com/maps?q=Av.%20El%20Sol%20612%2C%20Cusco%2C%20Peru&output=embed"
                  width="400" height="250" title="Map showing Av. El Sol 612, Cusco, Peru"
                  loading="lazy">
                </iframe>
            </div>

            <section class="contact-form-section">
                <form action="#" method="post">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email"
                      required>

                    <fieldset>
                        <legend>Message Purpose</legend>

                        <label for="general">
                            <input type="radio" id="general" name="purpose" value="general"
                              required>
                            General Inquiry
                        </label>

                        <label for="reservation">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>

                        <label for="suggestion">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4"
                      placeholder="Type your message here" required></textarea>

                    <label for="newsletter" class="newsletter-label">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>
                </form>
            </section>
        </div>

        <section class="team">
            <h2>We Are Here to Serve You</h2>

            <div class="team-gallery">
                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of our rafting manager">
                    <figcaption>Maria Lopez — Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of our lead rafting guide">
                    <figcaption>Daniel Torres — Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg"
                      alt="Portrait of our customer service representative">
                    <figcaption>Sofia Ramirez — Customer Service</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>©2026 Wild Pad Rafting | Luz Aroni | Cusco, Peru</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram icon">
            </a>

            <a href="https://tiktok.com">
                <img src="images/tiktok.svg" alt="TikTok icon">
            </a>
        </nav>
    </footer>
</body>

</html>
